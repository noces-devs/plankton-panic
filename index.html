```html
<!DOCTYPE html>
<html>
<head>
  <title>Plankton Panic!</title>

  <style>
    body {
      margin: 0;

      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;

      color: white;
      overflow-x: hidden;
    }

    .box {
      width: 90%;
      max-width: 1100px;

      border: 5px solid white;
      border-radius: 25px;
      background: #07577f;

    h1 {
      font-size: 50px;
      margin-top: 0;
      color: #ffe54d;
      text-shadow: 4px 4px #222;
    }

    .subtitle {
      font-size: 20px;
      font-weight: bold;
    }

    .game-area {
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 40px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    /* TIMER */

    .timer-area {
      min-width: 300px;
    }

    #timer {
      font-size: 120px;
      font-weight: bold;
      color: #ffe54d;

      margin: 20px 0;
    }

    button {
      font-size: 20px;
      font-weight: bold;
      padding: 12px 25px;
      margin: 5px;
      border: none;
      border-radius: 15px;
      background: #ffe54d;
      color: #222;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.08);
      background: #fff27d;
    }

    #message {
      font-size: 18px;
      font-weight: bold;
    }

    /* WHEEL */

    .wheel-area {
      min-width: 320px;
    }

    .wheel-container {
      position: relative;
      width: 300px;
      height: 300px;
      margin: auto;
    }

    #wheel {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      border: 8px solid white;
      position: relative;
      overflow: hidden;

      background: conic-gradient(
        #ffe54d 0deg 60deg,
        #f28c28 60deg 120deg,
        #62c370 120deg 180deg,
        #ef5350 180deg 240deg,
        #9b59b6 240deg 300deg,
        #3498db 300deg 360deg
      );

      transition: transform 4s cubic-bezier(0.15, 0.85, 0.25, 1);
    }

    .wheel-labels {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .label {
      position: absolute;
      width: 90px;

      font-weight: bold;
      color: #222;
      text-align: center;
    }

    .label1 {
      top: 30px;
      left: 105px;
    }

    .label2 {
      top: 85px;

    }

    .label3 {
      bottom: 45px;
      right: 25px;
    }

    .label4 {
      bottom: 25px;
      left: 105px;
    }

    .label5 {
      bottom: 80px;
      left: 20px;
    }

    .label6 {
      top: 85px;
      left: 20px;
    }

    .pointer {
      position: absolute;

      left: 50%;

</head>

<body>

<div class="box">

  <h1>🧽 PLANKTON PANIC! 🦠</h1>

  <p class="subtitle">
    🔨 30-SECOND BONK CHALLENGE 🔨
  </p>

  <div class="game-area">

    <!-- TIMER -->
    <div class="timer-area">

      <h2>⏱️ TIMER</h2>

      <div id="timer">30</div>

      <button onclick="startTimer()">START!</button>
      <button onclick="resetTimer()">RESET</button>

      <p id="message">
        Get ready to bonk!
      </p>

    </div>


    <!-- SPIN THE WHEEL -->
    <div class="wheel-area">

      <h2>🎡 SPIN THE WHEEL!</h2>

      <div class="wheel-container">

        <div class="pointer"></div>

        <div id="wheel">

          <div class="wheel-labels">

            <div class="label label1">
              🦠<br>BONK!
            </div>

            <div class="label label2">
              🍔<br>KRABBY PATTY
            </div>

            <div class="label label3">
              🐌<br>FEED GARY
            </div>

            <div class="label label4">
              🎵<br>SING!
            </div>

            <div class="label label5">
              🧽<br>CLEAN!
            </div>

            <div class="label label6">
              🏃<br>RUN!
            </div>

          </div>

        </div>

      </div>

      <button onclick="spinWheel()">
        🎡 SPIN!
      </button>

      <div id="result">
        Spin me!
      </div>

    </div>

  </div>

</div>


<script>

  /* =========================
     TIMER
  ========================= */

  let time = 30;
  let countdown = null;

  function startTimer() {

    if (countdown !== null) {
      return;
    }

    document.getElementById("message").innerHTML =
      "GO! BONK THAT PLANKTON! 🦠🔨";

    countdown = setInterval(function() {

      time--;

      document.getElementById("timer").innerHTML = time;

      if (time <= 0) {

        clearInterval(countdown);
        countdown = null;

        document.getElementById("message").innerHTML =
          "TIME'S UP! 🦠💥";

      }

    }, 1000);
  }


  function resetTimer() {

    clearInterval(countdown);
    countdown = null;

    time = 30;

    document.getElementById("timer").innerHTML = time;

    document.getElementById("message").innerHTML =
      "Get ready to bonk!";
  }


  /* =========================
     SPIN THE WHEEL
  ========================= */

  let rotation = 0;

  const activities = [
    "🦠 BONK PLANKTON!",
    "🍔 MAKE A KRABBY PATTY!",
    "🐌 FEED GARY!",
    "🎵 SING A SONG!",
    "🧽 CLEAN THE KRUSTY KRAB!",
    "🏃 RUN FROM PLANKTON!"
  ];


  function spinWheel() {

    const wheel = document.getElementById("wheel");

    // Random number between 0 and 5
    const randomIndex =
      Math.floor(Math.random() * activities.length);

    // Add several full rotations
    rotation += 1440 + (randomIndex * 60);

    wheel.style.transform =
      "rotate(" + rotation + "deg)";

    // Wait for the animation to finish
    setTimeout(function() {

      document.getElementById("result").innerHTML =
        "🎉 " + activities[randomIndex];

    }, 4000);
  }

</script>

</body>
</html>
