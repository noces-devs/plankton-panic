<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Plankton Panic!</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Arial, sans-serif;
      color: white;

      /* UNDERWATER BACKGROUND */
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.15) 0 8px, transparent 9px),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,0.12) 0 12px, transparent 13px),
        radial-gradient(circle at 40% 70%, rgba(255,255,255,0.10) 0 6px, transparent 7px),
        linear-gradient(
          to bottom,
          #42d4e8 0%,
          #149ac7 45%,
          #075b91 100%
        );

      overflow: hidden;
    }

    /* BUBBLES */
    body::before,
    body::after {
      content: "";
      position: fixed;
      border: 3px solid rgba(255,255,255,0.45);
      border-radius: 50%;
      pointer-events: none;
    }

    body::before {
      width: 45px;
      height: 45px;
      left: 8%;
      bottom: 15%;
      box-shadow:
        70px 80px 0 -10px rgba(255,255,255,0.25),
        130px -40px 0 -15px rgba(255,255,255,0.3),
        75vw 50px 0 -5px rgba(255,255,255,0.25),
        82vw 180px 0 -12px rgba(255,255,255,0.3);
    }

    body::after {
      width: 20px;
      height: 20px;
      right: 15%;
      bottom: 25%;
      box-shadow:
        -100px 100px 0 5px rgba(255,255,255,0.2),
        80px -150px 0 8px rgba(255,255,255,0.2);
    }

    /* MAIN GAME CARD */
    .box {
      position: relative;
      z-index: 2;

      width: min(90%, 550px);
      padding: 35px 25px;

      border: 6px solid white;
      border-radius: 30px;

      background: rgba(0, 76, 120, 0.82);

      box-shadow:
        0 12px 0 rgba(0, 45, 75, 0.5),
        0 20px 40px rgba(0,0,0,0.3);
    }

    /* TITLE */
    h1 {
      margin: 0;

      font-size: clamp(2.7rem, 10vw, 5rem);
      font-weight: 900;

      color: #ffe84a;

      text-shadow:
        5px 5px 0 #222,
        -2px -2px 0 #222,
        2px -2px 0 #222,
        -2px 2px 0 #222;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 1.15rem;
      font-weight: bold;
    }

    /* TIMER */
    #timer {
      margin: 25px 0;

      font-size: clamp(6rem, 25vw, 10rem);
      font-weight: 900;
      line-height: 1;

      color: white;

      text-shadow:
        6px 6px 0 #123,
        0 0 20px rgba(255,255,255,0.25);
    }

    /* START BUTTON */
    button {
      padding: 16px 35px;

      border: none;
      border-radius: 18px;

      background: #ffe84a;
      color: #123;

      font-size: 1.4rem;
      font-weight: 900;

      cursor: pointer;

      box-shadow: 0 7px 0 #b89d00;

      transition: transform 0.1s;
    }

    button:hover {
      transform: scale(1.05);
    }

    button:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #b89d00;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    #message {
      min-height: 25px;
      margin-top: 22px;

      font-size: 1.1rem;
      font-weight: bold;
    }

    /* LITTLE SEAWEED */
    .seaweed {
      position: fixed;
      bottom: 0;
      width: 100%;
      height: 70px;
      z-index: 1;

      background:
        repeating-linear-gradient(
          75deg,
          transparent 0 30px,
          rgba(20, 130, 75, 0.8) 31px 42px,
          transparent 43px 70px
        );
      opacity: 0.7;
    }

    /* WHEN TIME RUNS OUT */
    .finished {
      animation: shake 0.4s;
    }

    @keyframes shake {
      0%   { transform: translateX(0); }
      25%  { transform: translateX(-8px); }
      50%  { transform: translateX(8px); }
      75%  { transform: translateX(-8px); }
      100% { transform: translateX(0); }
    }
  </style>
</head>

<body>

  <div class="seaweed"></div>

  <div class="box" id="gameBox">

    <h1>PLANKTON PANIC!</h1>

    <div class="subtitle">
      🦠 30-SECOND BONK CHALLENGE 🔨
    </div>

    <div id="timer">30</div>

    <button id="startButton" onclick="startTimer()">
      START!
    </button>

    <div id="message">
      Get ready to bonk!
    </div>

  </div>


  <script>

    let time = 30;
    let countdown;
    let running = false;

    function startTimer() {

      if (running) return;

      running = true;
      time = 30;

      const timer = document.getElementById("timer");
      const button = document.getElementById("startButton");
      const message = document.getElementById("message");
      const box = document.getElementById("gameBox");

      timer.innerHTML = time;

      button.disabled = true;
      button.innerHTML = "PLAYING...";

      message.innerHTML = "GO! BONK THAT PLANKTON! 🔨";

      box.classList.remove("finished");

      countdown = setInterval(function() {

        time--;

        timer.innerHTML = time;

        if (time <= 0) {

          clearInterval(countdown);

          running = false;

          button.disabled = false;
          button.innerHTML = "PLAY AGAIN";

          message.innerHTML = "TIME'S UP! 🦠";

          box.classList.add("finished");
        }

      }, 1000);
    }

  </script>

</body>
</html>
